# The Docker image that will be used to build your app
image:
  name: ghcr.io/cachix/devenv/devenv:latest

stages:
  - test
  - build
  - sync-repo

default:
  tags:
  # Functions that should be executed before the build script is run
  before_script:
    - devenv shell echo "run install deps setup"

# Global builds and stuff
variables:
  DEBUG: "1" # MAY HORRIBLY LEAK SECRETS, PROCEED WITH CAUTION
  FF_ENABLE_COMMIT_DATA: "true"
  FF_GENERATE_SOCIAL_CARDS: "true"
  SECURE_FILES_DOWNLOAD_PATH: .secretskit
  GIT_DEPTH: "0"

pages:
  environment:
    name: production
    url: https://wiki.andreijiroh.dev
  stage: build
  script:
    - devenv tasks run wiki:deploy
  artifacts:
    paths:
      # The folder that contains the files to be exposed at the Page URL
      - public
  variables:
    CF_PAGES_PROJECT_NAME: ajhalili2006
  rules:
    # This ensures that only pushes to the default branch will trigger
    # a pages deploy
    - if: $CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH
